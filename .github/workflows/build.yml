name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # استفاده از نسخه جدید سازگار با گیت‌هاب
      - uses: actions/checkout@v4

      # ستاپ جاوا ۱۷ با اکشن v4 برای رفع وارنینگ
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ستاپ فلاتر پایدار
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # ساخت فایل‌های نیتیو اندروید با تنظیم نام پکیج
      - name: Create Native Platform Files
        run: |
          flutter create . --platforms=android --org=com.ashkboos.tracker

      # افزایش خودکار حداقل نسخه اندروید (برای هماهنگی با پکیج‌های شیرینگ و اسکرین‌تایم)
      - name: Configure Android SDK versions
        run: |
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KonkurTracker-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk